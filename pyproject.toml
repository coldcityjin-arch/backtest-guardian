[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backtest-guardian"
version = "0.1.0"
description = "A small, auditable toolkit for safer time-series backtests."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "coldcityjin-arch"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]

[project.scripts]
backtest-guardian = "backtest_guardian.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

